nelmio_api_doc:
    documentation:
        info:
            title: GastroVoice AI API
            description: REST API for restaurant management, menu, orders, reservations and voice assistant
            version: '1.0.0'
        components:
            securitySchemes:
                Bearer:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
        security:
            - Bearer: []
    areas:
        path_patterns:
            - ^/api(?!/doc)
