doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        types:
            uuid: Symfony\Bridge\Doctrine\Types\UuidType

    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            Identity:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Infrastructure/Persistence/Doctrine'
                prefix: 'App\Identity\Domain\Entity'
                alias: Identity
            RestaurantManagement:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/RestaurantManagement/Infrastructure/Persistence/Doctrine'
                prefix: 'App\RestaurantManagement\Domain\Entity'
                alias: RestaurantManagement
            Menu:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Menu/Infrastructure/Persistence/Doctrine'
                prefix: 'App\Menu\Domain\Entity'
                alias: Menu
            Ordering:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Ordering/Infrastructure/Persistence/Doctrine'
                prefix: 'App\Ordering\Domain\Entity'
                alias: Ordering
            Reservations:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Reservations/Infrastructure/Persistence/Doctrine'
                prefix: 'App\Reservations\Domain\Entity'
                alias: Reservations
            VoiceAssistant:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/VoiceAssistant/Infrastructure/Persistence/Doctrine'
                prefix: 'App\VoiceAssistant\Domain\Entity'
                alias: VoiceAssistant

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
