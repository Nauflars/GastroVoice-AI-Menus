framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2

            sync: 'sync://'

            failed: 'doctrine://default?queue_name=failed'

        routing:
            App\Shared\Domain\Event\DomainEventInterface: sync
