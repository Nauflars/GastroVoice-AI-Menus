services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: development
    volumes:
      - ./backend:/var/www/html
      - ./docker/backend/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/backend/supervisord.conf:/etc/supervisord.conf:ro
    ports:
      - "8080:8080"
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-gastrovoice}:${POSTGRES_PASSWORD:-gastrovoice}@db:5432/${POSTGRES_DB:-gastrovoice}?serverVersion=16&charset=utf8"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET_KEY: /var/www/html/config/jwt/private.pem
      JWT_PUBLIC_KEY: /var/www/html/config/jwt/public.pem
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-gastrovoice_jwt_passphrase}
      JWT_TOKEN_TTL: "3600"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MESSENGER_TRANSPORT_DSN: "redis://redis:6379/messages"
      CORS_ALLOW_ORIGIN: "^https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?$$"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gastrovoice
    command: ["/bin/sh", "-c", "cd /var/www/html && composer install --no-interaction && /usr/bin/supervisord -c /etc/supervisord.conf"]

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gastrovoice}
      POSTGRES_USER: ${POSTGRES_USER:-gastrovoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gastrovoice}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gastrovoice}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gastrovoice

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gastrovoice

  asterisk:
    build:
      context: .
      dockerfile: docker/asterisk/Dockerfile
    ports:
      - "5060:5060/udp"
      - "10000-20000:10000-20000/udp"
    volumes:
      - asterisk_logs:/var/log/asterisk
    depends_on:
      - backend
    networks:
      - gastrovoice

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:8080"
    depends_on:
      - backend
    networks:
      - gastrovoice

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - gastrovoice

volumes:
  postgres_data:
  redis_data:
  asterisk_logs:

networks:
  gastrovoice:
    driver: bridge
