services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: development
    volumes:
      - ./backend:/var/www/html
      - ./docker/backend/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/backend/supervisord.conf:/etc/supervisord.conf:ro
    ports:
      - "18080:8080"
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-gastrovoice}:${POSTGRES_PASSWORD:-gastrovoice}@db:5432/${POSTGRES_DB:-gastrovoice}?serverVersion=16&charset=utf8"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET_KEY: /var/www/html/config/jwt/private.pem
      JWT_PUBLIC_KEY: /var/www/html/config/jwt/public.pem
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-gastrovoice_jwt_passphrase}
      JWT_TOKEN_TTL: "3600"
      MESSENGER_TRANSPORT_DSN: "redis://redis:6379/messages"
      CORS_ALLOW_ORIGIN: "^https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?$$"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MENU_MODEL: ${OPENAI_MENU_MODEL:-gpt-4.1}
      OPENAI_INTENT_MODEL: ${OPENAI_INTENT_MODEL:-gpt-4.1-mini}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-4o-mini-realtime}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-tts-1}
      OPENAI_TTS_VOICE: ${OPENAI_TTS_VOICE:-alloy}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gastrovoice
    command: ["/bin/sh", "-c", "cd /var/www/html && composer install --no-interaction && /usr/bin/supervisord -c /etc/supervisord.conf"]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gastrovoice}
      POSTGRES_USER: ${POSTGRES_USER:-gastrovoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gastrovoice}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gastrovoice}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gastrovoice

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gastrovoice

  freeswitch:
    build:
      context: docker/freeswitch
      dockerfile: Dockerfile
    profiles:
      - telephony
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "16384-16484:16384-16484/udp"
    environment:
      GASTROVOICE_API: "http://backend:8080"
      RESTAURANT_ID: "${RESTAURANT_ID:-a1b2c3d4-e5f6-7890-abcd-ef1234567890}"
      MEDIA_BRIDGE_WS: "ws://media-bridge:8765"
    depends_on:
      - backend
      - media-bridge
    networks:
      - gastrovoice

  asterisk:
    build:
      context: .
      dockerfile: docker/asterisk/Dockerfile
    profiles:
      - telephony
    ports:
      - "5061:5060/udp"
      - "10000-10100:10000-10100/udp"
    environment:
      GASTROVOICE_API: "http://backend:8080"
      RESTAURANT_ID: "${RESTAURANT_ID:-a1b2c3d4-e5f6-7890-abcd-ef1234567890}"
    depends_on:
      - backend
      - media-bridge
    networks:
      - gastrovoice

  media-bridge:
    build:
      context: docker/media-bridge
      dockerfile: Dockerfile
    profiles:
      - telephony
    ports:
      - "8765:8765"
      - "9093:9093"
    environment:
      GASTROVOICE_API_URL: "http://backend:8080"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-4o-mini-realtime}
      DEFAULT_VOICE: ${OPENAI_TTS_VOICE:-coral}
      DEFAULT_RESTAURANT_ID: "${RESTAURANT_ID:-a1b2c3d4-e5f6-7890-abcd-ef1234567890}"
      DEFAULT_RESTAURANT_NAME: "${RESTAURANT_NAME:-el restaurante}"
    depends_on:
      - backend
    networks:
      - gastrovoice

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "15173:5173"
    environment:
      VITE_API_URL: "http://localhost:18080"
    depends_on:
      - backend
    networks:
      - gastrovoice

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "18025:8025"
    networks:
      - gastrovoice

volumes:
  postgres_data:
  redis_data:
  freeswitch_logs:

networks:
  gastrovoice:
    driver: bridge
