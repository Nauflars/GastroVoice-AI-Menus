; ─────────────────────────────────────────────────────────────────────────────
; GastroVoice AI — PJSIP Configuration (Asterisk 22+)
; ─────────────────────────────────────────────────────────────────────────────

; ── Transport ───────────────────────────────────────────────────────────────

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=192.168.1.139
external_signaling_address=192.168.1.139
local_net=172.18.0.0/16

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
external_media_address=192.168.1.139
external_signaling_address=192.168.1.139
local_net=172.18.0.0/16

; ── Softphone endpoint (register a SIP softphone like Ooh! / Ooh!Ooh!) ────

[softphone]
type=endpoint
context=gastrovoice
disallow=all
allow=ulaw
allow=alaw
auth=softphone-auth
aors=softphone
transport=transport-udp
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=no
media_address=192.168.1.139

[softphone-auth]
type=auth
auth_type=userpass
username=softphone
password=gastrovoice123

[softphone]
type=aor
max_contacts=5
remove_existing=yes
