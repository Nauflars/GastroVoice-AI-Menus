[default]
exten => _X.,1,NoOp(Incoming call to GastroVoice AI)

; ─────────────────────────────────────────────────────────────────────────────
; Traditional mode — Audio → Whisper STT → gpt-4.1-mini → TTS → Audio
; Dial extension 100 or any number that is NOT 200
; ─────────────────────────────────────────────────────────────────────────────
[gastrovoice]
exten => 100,1,NoOp(GastroVoice AI — Traditional Mode)
 same => n,Answer()
 same => n,Wait(1)
 same => n,AGI(gastrovoice.sh)
 same => n,Hangup()

; ─────────────────────────────────────────────────────────────────────────────
; Realtime mode — Audio → gpt-4o-mini-realtime → Audio  (bidirectional stream)
; Dial extension 200
; Requires res_audiosocket — streams raw slin to the media-bridge TCP server.
; ─────────────────────────────────────────────────────────────────────────────
exten => 200,1,NoOp(GastroVoice AI — Realtime Mode)
 same => n,Answer()
 same => n,Wait(1)
 same => n,AudioSocket(${CHANNEL(uniqueid)},media-bridge:9093)
 same => n,Hangup()

; Catch-all → traditional mode (default for any other extension)
exten => _X.,1,NoOp(GastroVoice AI — Traditional Mode [catch-all])
 same => n,Answer()
 same => n,Wait(1)
 same => n,AGI(gastrovoice.sh)
 same => n,Hangup()
